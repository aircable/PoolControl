name: Release From Changelog

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Extract release notes for tag from CHANGELOG.md
        id: notes
        shell: bash
        run: |
          set -euo pipefail
          TAG="${GITHUB_REF_NAME}"
          if [[ ! -f CHANGELOG.md ]]; then
            echo "CHANGELOG.md not found" >&2
            exit 1
          fi

          awk -v tag="$TAG" '
            BEGIN { in_section=0 }
            $0 ~ "^## \\[" tag "\\]" { in_section=1; next }
            $0 ~ "^## \\[" && in_section==1 { exit }
            in_section==1 { print }
          ' CHANGELOG.md | sed '/^[[:space:]]*$/N;/^\n$/D' > release-notes.txt

          if [[ ! -s release-notes.txt ]]; then
            echo "No changelog section found for ${TAG}" >&2
            exit 1
          fi

      - name: Publish GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          body_path: release-notes.txt
          generate_release_notes: false
